apiVersion: v1
kind: Pod
metadata:
  name: fastapik8s-pod
  labels:
    app: fastapik8s-demo
spec:
  containers:
    - name: fastapik8s-demo
      image: demo-fastapik8s:v1
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8000
      env:
        - name: APP_VERSION
          value: "v1.0.0"
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8000
        initialDelaySeconds: 10
        periodSeconds: 15
