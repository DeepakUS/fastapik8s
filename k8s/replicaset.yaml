apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: fastapik8s-rs
  labels:
    app: fastapik8s-rs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapik8s-rs
  template:
    metadata:
      labels:
        app: fastapik8s-rs
    spec:
      containers:
        - name: fastapik8s-demo
          image: demo-fastapik8s:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "v1.0.0"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
